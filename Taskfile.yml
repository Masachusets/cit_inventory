# Taskfile для управления приложением CIT Inventory
# Документация: https://taskfile.dev
# Запуск задач: go-task <имя_задачи> (список: go-task --list)

version: '3'

vars:
  BIN_DIR: bin
  SERVER_PKG: ./cmd/server
  IMPORT_PKG: ./cmd/import
  MIGRATIONS_DIR: migrations
  # Локация бинаря goose: сначала PATH, затем ~/go/bin
  GOOSE:
    sh: command -v goose >/dev/null 2>&1 && echo goose || echo $HOME/go/bin/goose
  # DSN для goose: DATABASE_URL (приоритет, как в config.GetDSN), иначе сборка из компонентов
  DB_DSN: '{{.DATABASE_URL | default (printf "postgres://%s:%s@%s:%s/%s?sslmode=%s" (.DB_USER | default "admin") (.DB_PASSWORD | default "admin") (.DB_HOST | default "localhost") (.DB_PORT | default "5432") (.DB_NAME | default "inventory") (.DB_SSLMODE | default "disable"))}}'

# Глобальная загрузка .env: переменные попадают в окружение всех задач
# и доступны в шаблонах как {{.VAR}} (отсутствующий файл игнорируется).
# Благодаря этому `go-task run` видит настройки БД без ручного export.
dotenv: ['.env']

# Подключение goose к БД (для всех задач миграций).
# DSN собирается в var DB_DSN: DATABASE_URL либо компоненты из .env.
env:
  GOOSE_DRIVER: postgres
  GOOSE_DBSTRING: '{{.DB_DSN}}'

tasks:
  default:
    desc: Показать список доступных задач
    cmd: go-task --list

  run:
    desc: Запуск HTTP-сервера
    cmd: go run {{.SERVER_PKG}} {{.CLI_ARGS}}

  dev:
    desc: Поднять БД и запустить сервер
    cmds:
      - task: db:up
      - task: run

  import:
    desc: 'Импорт из Excel: номенклатурная таблица + карточки КУ Ф-111 + оборудование Учет (go-task import -- -excel=data/excel -ums=data/excel/UMS.xlsx)'
    cmd: go run {{.IMPORT_PKG}} {{.CLI_ARGS}}

  departments:
    desc: 'Заполнить departments из data/departments.txt, одноразово (go-task departments -- -file=...)'
    cmd: go run {{.IMPORT_PKG}} departments {{.CLI_ARGS}}

  build:
    desc: Собрать бинарники в bin/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/server {{.SERVER_PKG}}
      - go build -o {{.BIN_DIR}}/import {{.IMPORT_PKG}}

  test:
    desc: Запуск тестов
    cmd: go test ./...

  cover:
    desc: Покрытие тестов (coverage.out + сводка)
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: Статический анализ (go vet)
    cmd: go vet ./...

  fmt:
    desc: Форматирование кода (gofmt -w)
    cmd: gofmt -w cmd internal pkg

  fmt:check:
    desc: Проверка форматирования кода (без изменений)
    cmd: |
      out="$(gofmt -l cmd internal pkg)"
      if [ -n "$out" ]; then
        echo "Не отформатированы:" >&2
        echo "$out" >&2
        exit 1
      fi

  lint:
    desc: Линтер (golangci-lint)
    cmd: |
      found=""
      for bin in golangci-lint "$HOME/go/bin/golangci-lint-v2" "$HOME/go/bin/golangci-lint"; do
        if ! command -v "$bin" >/dev/null 2>&1 && [ ! -x "$bin" ]; then
          continue
        fi
        found=1
        "$bin" run ./...
        rc=$?
        # 3 = ошибка запуска (например, несовместимость версий) — пробуем следующий бинарник
        if [ "$rc" -ne 3 ]; then
          exit "$rc"
        fi
      done
      if [ -z "$found" ]; then
        echo 'golangci-lint не найден. Установите: go-task tools' >&2
        exit 1
      fi
      exit 3

  check:
    desc: 'Полная проверка: форматирование, vet, линтер, тесты'
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test

  tidy:
    desc: Привести go.mod/go.sum в порядок (go mod tidy)
    cmd: go mod tidy

  tools:
    desc: Установка инструментов (task, golangci-lint, goose)
    cmds:
      - go install github.com/go-task/task/v3/cmd/task@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest

  env:init:
    desc: Создать .env из .env.example (если отсутствует)
    cmd: |
      if [ -f .env ]; then
        echo '.env уже существует'
      else
        cp .env.example .env
        echo '.env создан из .env.example'
      fi

  config:init:
    desc: Создать config.toml из config.toml.example (если отсутствует)
    cmd: |
      if [ -f config.toml ]; then
        echo 'config.toml уже существует'
      else
        cp config.toml.example config.toml
        echo 'config.toml создан из config.toml.example'
      fi

  db:up:
    desc: Запуск PostgreSQL и ожидание готовности
    cmd: docker compose up -d --wait

  db:down:
    desc: Остановка PostgreSQL
    cmd: docker compose down

  db:ps:
    desc: Статус контейнеров
    aliases: [db:status]
    cmd: docker compose ps

  db:logs:
    desc: Логи PostgreSQL (follow)
    aliases: [db:log]
    interactive: true
    cmd: docker compose logs -f db

  db:shell:
    desc: Интерактивный psql
    aliases: [db:psql]
    interactive: true
    cmd: docker exec -it inventory_db psql -U {{.DB_USER | default "admin"}} -d {{.DB_NAME | default "inventory"}}

  # --- Миграции (goose) ---
  # Типовые сценарии:
  #   go-task db:migrate:status               — статус миграций
  #   go-task db:migrate                      — применить pending-миграции
  #   go-task db:migrate:create -- add_column — создать файл миграции
  #   go-task db:migrate:down                 — откатить последнюю миграцию
  #   go-task db:migrate:validate             — проверить файлы без выполнения

  db:migrate:
    desc: Применить pending-миграции (goose up)
    preconditions:
      - sh: docker ps -q --filter "name=inventory_db" | grep -q .
        msg: 'Контейнер inventory_db не запущен — выполните go-task db:up'
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} up'

  db:migrate:status:
    desc: 'Статус миграций (goose status)'
    preconditions:
      - sh: docker ps -q --filter "name=inventory_db" | grep -q .
        msg: 'Контейнер inventory_db не запущен — выполните go-task db:up'
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} status'

  db:migrate:down:
    desc: Откатить последнюю миграцию (goose down)
    preconditions:
      - sh: docker ps -q --filter "name=inventory_db" | grep -q .
        msg: 'Контейнер inventory_db не запущен — выполните go-task db:up'
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} down'

  db:migrate:redo:
    desc: Перезапустить последнюю миграцию — down + up (goose redo)
    preconditions:
      - sh: docker ps -q --filter "name=inventory_db" | grep -q .
        msg: 'Контейнер inventory_db не запущен — выполните go-task db:up'
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} redo'

  db:migrate:reset:
    desc: 'Откатить ВСЕ миграции (goose reset)'
    prompt: 'Все миграции будут откачены, данные таблиц потеряны. Продолжить?'
    preconditions:
      - sh: docker ps -q --filter "name=inventory_db" | grep -q .
        msg: 'Контейнер inventory_db не запущен — выполните go-task db:up'
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} reset'

  db:migrate:create:
    desc: 'Создать файл миграции (goose create): go-task db:migrate:create -- <name> [sql|go]'
    preconditions:
      - sh: test -n '{{.CLI_ARGS}}'
        msg: 'Укажите имя миграции: go-task db:migrate:create -- <name> [sql|go]'
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}}'

  db:migrate:validate:
    desc: Проверить файлы миграций без выполнения (goose validate)
    cmd: '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} validate'

  db:init:
    desc: Инициализация схемы БД (применение миграций, см. db:migrate)
    cmds:
      - task: db:migrate

  db:reset:
    desc: Пересоздать БД с нуля (ВСЕ ДАННЫЕ БУДУТ УДАЛЕНЫ)
    prompt: 'Все данные базы будут удалены. Продолжить?'
    cmds:
      - docker compose down -v
      - task: db:up
      - task: db:init

  clean:
    desc: Удалить артефакты сборки
    cmd: rm -rf {{.BIN_DIR}} coverage.out
