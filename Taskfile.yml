# Taskfile для управления приложением CIT Inventory
# Документация: https://taskfile.dev
# Запуск задач: go-task <имя_задачи> (список: go-task --list)

version: '3'

vars:
  BIN_DIR: bin
  SERVER_PKG: ./cmd/server
  IMPORT_PKG: ./cmd/import

# Глобальная загрузка .env: переменные попадают в окружение всех задач
# и доступны в шаблонах как {{.VAR}} (отсутствующий файл игнорируется).
# Благодаря этому `go-task run` видит настройки БД без ручного export.
dotenv: ['.env']

tasks:
  default:
    desc: Показать список доступных задач
    cmd: go-task --list

  run:
    desc: Запуск HTTP-сервера
    cmd: go run {{.SERVER_PKG}} {{.CLI_ARGS}}

  dev:
    desc: Поднять БД и запустить сервер
    cmds:
      - task: db:up
      - task: run

  import:
    desc: 'Импорт данных из Excel-файлов (флаги: go-task import -- -db=... -excel=...)'
    cmd: go run {{.IMPORT_PKG}} {{.CLI_ARGS}}

  build:
    desc: Собрать бинарники в bin/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/server {{.SERVER_PKG}}
      - go build -o {{.BIN_DIR}}/import {{.IMPORT_PKG}}

  test:
    desc: Запуск тестов
    cmd: go test ./...

  cover:
    desc: Покрытие тестов (coverage.out + сводка)
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: Статический анализ (go vet)
    cmd: go vet ./...

  fmt:
    desc: Форматирование кода (gofmt -w)
    cmd: gofmt -w cmd internal pkg

  fmt:check:
    desc: Проверка форматирования кода (без изменений)
    cmd: |
      out="$(gofmt -l cmd internal pkg)"
      if [ -n "$out" ]; then
        echo "Не отформатированы:" >&2
        echo "$out" >&2
        exit 1
      fi

  lint:
    desc: Линтер (golangci-lint)
    cmd: |
      found=""
      for bin in golangci-lint "$HOME/go/bin/golangci-lint-v2" "$HOME/go/bin/golangci-lint"; do
        if ! command -v "$bin" >/dev/null 2>&1 && [ ! -x "$bin" ]; then
          continue
        fi
        found=1
        "$bin" run ./...
        rc=$?
        # 3 = ошибка запуска (например, несовместимость версий) — пробуем следующий бинарник
        if [ "$rc" -ne 3 ]; then
          exit "$rc"
        fi
      done
      if [ -z "$found" ]; then
        echo 'golangci-lint не найден. Установите: go-task tools' >&2
        exit 1
      fi
      exit 3

  check:
    desc: 'Полная проверка: форматирование, vet, линтер, тесты'
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test

  tidy:
    desc: Привести go.mod/go.sum в порядок (go mod tidy)
    cmd: go mod tidy

  tools:
    desc: Установка инструментов (task, golangci-lint)
    cmds:
      - go install github.com/go-task/task/v3/cmd/task@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

  env:init:
    desc: Создать .env из .env.example (если отсутствует)
    cmd: |
      if [ -f .env ]; then
        echo '.env уже существует'
      else
        cp .env.example .env
        echo '.env создан из .env.example'
      fi

  config:init:
    desc: Создать config.toml из config.toml.example (если отсутствует)
    cmd: |
      if [ -f config.toml ]; then
        echo 'config.toml уже существует'
      else
        cp config.toml.example config.toml
        echo 'config.toml создан из config.toml.example'
      fi

  db:up:
    desc: Запуск PostgreSQL и ожидание готовности
    cmd: docker compose up -d --wait

  db:down:
    desc: Остановка PostgreSQL
    cmd: docker compose down

  db:ps:
    desc: Статус контейнеров
    aliases: [db:status]
    cmd: docker compose ps

  db:logs:
    desc: Логи PostgreSQL (follow)
    aliases: [db:log]
    interactive: true
    cmd: docker compose logs -f db

  db:shell:
    desc: Интерактивный psql
    aliases: [db:psql]
    interactive: true
    cmd: docker exec -it inventory_db psql -U {{.DB_USER | default "admin"}} -d {{.DB_NAME | default "inventory"}}

  db:init:
    desc: Инициализация схемы БД (sql/create.sql)
    preconditions:
      - sh: docker ps -q --filter "name=inventory_db" | grep -q .
        msg: 'Контейнер inventory_db не запущен — выполните go-task db:up'
    cmds:
      - docker exec -i inventory_db psql -U {{.DB_USER | default "admin"}} -d {{.DB_NAME | default "inventory"}} -v ON_ERROR_STOP=1 < sql/create.sql

  db:reset:
    desc: Пересоздать БД с нуля (ВСЕ ДАННЫЕ БУДУТ УДАЛЕНЫ)
    prompt: 'Все данные базы будут удалены. Продолжить?'
    cmds:
      - docker compose down -v
      - task: db:up
      - task: db:init

  clean:
    desc: Удалить артефакты сборки
    cmd: rm -rf {{.BIN_DIR}} coverage.out
